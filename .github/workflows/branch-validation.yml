name: Branch Name Validation

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Branch Name
        run: |
          chmod +x .github/scripts/validate-branch-name.sh
          .github/scripts/validate-branch-name.sh "${{ github.head_ref }}"