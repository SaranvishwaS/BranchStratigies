name: Package Name Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate package name
        run: |
          chmod +x .github/scripts/validate-branch-name.sh
          .github/scripts/validate-branch-name.sh